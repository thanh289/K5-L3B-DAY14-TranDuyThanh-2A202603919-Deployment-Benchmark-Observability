name: agent-eval-quality-gate

on:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run agent and quality gate
        env:
          AGENT_VERSION: v2
          PORT: '8002'
          MOCK_ERROR_RATE: '0'
          MOCK_SLOW_RATE: '0'
        run: |
          python app.py > /tmp/day14-eval-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8002/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8002/health > /dev/null
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85 --baseline reports/eval_v2.json
